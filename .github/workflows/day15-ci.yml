name: Day 15 CI - TypeScript, Vitest, MSW & Playwright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Full Test Suite & E2E Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 15_typescript_react_component_testing/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 15_typescript_react_component_testing/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: 1. Strict TypeScript Typecheck
        run: npm run typecheck

      - name: 2. Run Vitest Component & Unit Tests with V8 Coverage
        run: npm run test:coverage

      - name: 3. Build Production Bundle
        run: npm run build

      - name: 4. Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: 5. Run Playwright End-to-End Tests
        run: npm run test:e2e

      - name: Upload Test Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: 15_typescript_react_component_testing/frontend/coverage/

      - name: Upload Playwright Report Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 15_typescript_react_component_testing/frontend/playwright-report/
